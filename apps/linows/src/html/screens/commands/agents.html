<div class="cmd-panel" id="cmd-panel-agents" hidden>
    <div class="cmd-header-bar">
        <span class="cmd-input-bar-icon" id="cmd-agents-header-icon"></span>
        <span class="cmd-subtitle" id="cmd-agents-subtitle">Coding agents &amp; quota</span>
        <span class="cmd-pill">/agents</span>
    </div>

    <div class="cmd-todo-toolbar">
        <span class="cmd-todo-count" id="cmd-agents-count"></span>
        <div class="cmd-todo-toolbar-right">
            <button
                class="cmd-todo-btn"
                id="cmd-agents-live-btn"
                title="Ask each vendor for your plan's real limits (L)"
            ></button>
            <button class="cmd-todo-btn" id="cmd-agents-refresh-btn" title="Refresh (R)"></button>
        </div>
    </div>

    <div class="cmd-content cmd-agents-list" id="cmd-agents-list"></div>
</div>
